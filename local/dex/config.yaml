# Dev-only OIDC provider for the local profile. Loopback HTTP, one static user, in-memory storage.
# The user's password is "password" (bcrypt below); it protects nothing and is public by design.
issuer: http://dex.localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

staticPasswords:
  - email: dev@example.com
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: dev
    userID: "00000000-0000-4000-8000-000000000001"

staticClients:
  - id: omnigent-local
    name: Omnigent (local profile)
    secretEnv: DEX_CLIENT_SECRET
    redirectURIs:
      - http://localhost:8000/auth/callback
